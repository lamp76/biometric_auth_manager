name: biometric_auth_manager
description: A Flutter plugin for simplified biometric authentication (Fingerprint, FaceID) and Passkeys (WebAuthn) on Web, using native precompiled libraries and Swift Package Manager on iOS.
version: 1.0.0
homepage: https://github.com/lamp76/biometric_auth_manager
repository: https://github.com/lamp76/biometric_auth_manager
funding:
  - https://ko-fi.com/lamp76


environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.4.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.0
  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.biometric_auth_manager
        pluginClass: BiometricAuthManagerPlugin
      ios:
        pluginClass: BiometricAuthManagerPlugin
      web:
        pluginClass: BiometricAuthManagerWeb
        fileName: lib/biometric_auth_manager_web.dart
