name: Build and Verify Native Libraries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Library (.aar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build AAR with Gradle
        run: |
          cd native_src/android
          gradle assembleRelease

      - name: Copy AAR to Plugin
        run: |
          mkdir -p android/libs
          cp native_src/android/build/outputs/aar/android-release.aar android/libs/biometric_core.aar

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: android/libs/biometric_core.aar

  build-ios:
    name: Build iOS Library (.xcframework)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Device Archive
        run: |
          cd native_src/ios/BiometricCore
          xcodebuild archive \
            -scheme BiometricCore \
            -destination "generic/platform=iOS" \
            -archivePath "archives/BiometricCore-iOS.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Build Simulator Archive
        run: |
          cd native_src/ios/BiometricCore
          xcodebuild archive \
            -scheme BiometricCore \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "archives/BiometricCore-iOS-Simulator.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Assemble XCFramework
        run: |
          mkdir -p ios/Frameworks
          rm -rf ios/Frameworks/BiometricCore.xcframework
          xcodebuild -create-xcframework \
            -framework native_src/ios/BiometricCore/archives/BiometricCore-iOS.xcarchive/Products/usr/local/lib/BiometricCore.framework \
            -framework native_src/ios/BiometricCore/archives/BiometricCore-iOS-Simulator.xcarchive/Products/usr/local/lib/BiometricCore.framework \
            -output ios/Frameworks/BiometricCore.xcframework

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: ios/Frameworks/BiometricCore.xcframework

  verify:
    name: Flutter Example Verify & Test
    runs-on: macos-latest
    needs: [build-android, build-ios]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Download Android AAR
        uses: actions/download-artifact@v4
        with:
          name: android-aar
          path: android/libs

      - name: Download iOS XCFramework
        uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: ios/Frameworks/BiometricCore.xcframework

      - name: Install Plugin Dependencies
        run: flutter pub get

      - name: Run Plugin Tests
        run: flutter test

      - name: Install Example App Dependencies
        run: |
          cd example
          flutter pub get

      - name: Build Android APK
        run: |
          cd example
          flutter build apk --analyze-size

      - name: Build iOS Application (No Codesign)
        run: |
          cd example
          flutter build ios --no-codesign
